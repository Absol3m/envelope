[package]
name = "envelope-mcp"
version.workspace = true
license = "AGPL-3.0-or-later"
edition = "2021"
description = "Serveur MCP d'Envelope : SDK officiel rmcp, stdio, lecture seule de la base locale"

[lib]
name = "envelope_mcp"

[[bin]]
name = "envelope-mcp"
path = "src/main.rs"

[dependencies]
envelope-core = { path = "../envelope-core" }
# SDK officiel du protocole MCP (modelcontextprotocol/rust-sdk) : JSON-RPC, cycle de vie, négociation de version,
# validation des paramètres par schéma. On n'écrit plus que les outils.
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.9", default-features = false, features = ["client", "server", "macros", "schemars", "transport-io", "transport-async-rw"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

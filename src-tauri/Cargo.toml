[package]
name = "envelope"
version = "0.1.0"
description = "Client mail desktop ultra-rapide avec serveur MCP intégré"
edition = "2021"
rust-version = "1.80"

[workspace]
members = [".", "crates/envelope-core", "crates/envelope-mcp", "crates/envelope-appearance"]
default-members = ["."]

[lib]
name = "envelope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
envelope-core = { path = "crates/envelope-core" }
envelope-appearance = { path = "crates/envelope-appearance" }

# --- Tauri ---
tauri = { version = "2", features = ["macos-private-api"] }  # transparence (vibrancy) sous macOS
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# --- Async & erreurs ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Sérialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"        # Rust types -> JSON Schema (outils MCP, étape 3)

# --- Stockage local ---
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# --- Moteur mail (utilisé à partir de l'étape 2) ---
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "tokio1", "hostname"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
roxmltree = "0.21"  # lecture des fichiers autoconfig (config-v1.1.xml)
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }  # MX pour la détection
url = "2"                # analyse des liens List-Unsubscribe
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }  # échanges de jetons OAuth2
sha2 = "0.10"           # PKCE (S256)
base64 = "0.22"
dunce = "1"             # chemins Windows sans préfixe \\?\ (ouverture des pièces jointes)

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

# Secrets (mots de passe / tokens OAuth2) dans le trousseau de l'OS
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[package]
name = "envelope"
version.workspace = true
license = "AGPL-3.0-or-later"
description = "Client mail desktop ultra-rapide avec serveur MCP intégré"
edition = "2021"
rust-version = "1.80"

[workspace]
members = [".", "crates/envelope-core", "crates/envelope-mcp", "crates/envelope-appearance"]
default-members = ["."]

# Version unique des crates ; même valeur que package.json (que tauri.conf.json reprend), vérifié par
# scripts/check-version.sh.
[workspace.package]
version = "0.1.0-alpha.3"

[lib]
name = "envelope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
envelope-core = { path = "crates/envelope-core" }
envelope-appearance = { path = "crates/envelope-appearance" }

# --- Tauri ---
tauri = { version = "2", features = ["macos-private-api"] }  # transparence (vibrancy) sous macOS
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# --- Async & erreurs ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Sérialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Stockage local ---
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# --- Moteur mail (utilisé à partir de l'étape 2) ---
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-platform-verifier", "tokio1", "hostname"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"   # vérification des certificats par le système (trousseau macOS, Windows CryptoAPI, magasin Linux)
roxmltree = "0.21"  # lecture des fichiers autoconfig (config-v1.1.xml)
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }  # MX pour la détection
url = "2"                # analyse des liens List-Unsubscribe
percent-encoding = "2"
psl = "2"                 # liste des suffixes publics (domaine enregistrable), maintenue
utf7-imap = "0.3"         # noms de dossiers IMAP (UTF-7 modifié, RFC 3501)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }  # jetons OAuth2, autoconfig, désabonnement ; certificats vérifiés par le système (tls.rs)
sha2 = "0.11"           # PKCE (S256)
base64 = "0.23"
argon2 = "0.6"        # empreinte du mot de passe de verrouillage (Argon2id)
hex = "0.4"           # empreinte du message brut en hexadécimal
dunce = "1"             # chemins Windows sans préfixe \\?\ (ouverture des pièces jointes)

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

# Les macros procédurales et scripts de build tournent sur la machine de compilation : ne pas les « stripper »
# (macOS récent refuse de charger une bibliothèque de macros dont la table de symboles est supprimée).
[profile.release.build-override]
strip = "none"

# Plugins officiels Tauri réservés au bureau : instance unique, mémoire de la taille et de la position de la fenêtre
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# Mises à jour : `latest.json` des Releases GitHub, archives vérifiées par la clé publique de tauri.conf.json
# (indépendante des certificats Apple/Microsoft). TLS par défaut = rustls + rustls-platform-verifier (système).
tauri-plugin-updater = "2.14"

# Secrets (mots de passe / tokens OAuth2) dans le trousseau de l'OS
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }  # application factice : test de la barrière de verrouillage
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }  # certificat de test (STARTTLS)
tokio = { version = "1", features = ["test-util"] }  # horloge simulée (expiration des sessions IMAP gardées)

# Authentification native de l'utilisateur : Touch ID / mot de passe du Mac, Windows Hello. (Linux : pas de
# dispositif commun sans règle polkit installée en administrateur → mot de passe d'application.)
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
robius-authentication = "0.3"

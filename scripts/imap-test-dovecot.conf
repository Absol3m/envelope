protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
mail_plugins = quota
passdb {
  driver = static
  args = password=pass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
plugin {
  quota = maildir:User quota
  quota_rule = *:storage=40K
}
log_path = /dev/stderr

name: Signaler un bogue
description: Quelque chose ne marche pas comme prévu
body:
  - type: input
    id: version
    attributes: { label: Version d'Envelope et système, placeholder: "0.1.0-alpha.1 — macOS 26" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Étapes pour reproduire }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Résultat attendu / obtenu }
  - type: markdown
    attributes:
      value: "Ne collez ni identifiants ni contenu de vrais e-mails."

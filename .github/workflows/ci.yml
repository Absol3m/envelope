# Vérifications sur les trois systèmes : front (build + tests) et Rust (fmt, clippy, tests).
name: CI

# Réutilisé par le workflow de publication : une étiquette ne publie jamais un build dont les tests échouent.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Les manifestes (npm, Cargo, Tauri) déclarent tous la même version (et celle de l'étiquette, le cas échéant).
      - name: Versions concordantes
        if: runner.os == 'Linux'
        run: scripts/check-version.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Front : tsc + vite (produit aussi dist/, requis par la compilation de l'application Tauri).
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/i18n-status.mjs --check

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --workspace

  # Dépendances : vulnérabilités connues (RustSec), licences compatibles avec l'AGPL, sources autorisées, et npm.
  audit:
    name: Dépendances
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses bans sources
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      # Pas pour une étiquette : un avis npm sans rapport avec le code publié ne doit pas bloquer une publication (voir audit.yml).
      - if: github.ref_type == 'branch'
        run: pnpm audit --prod --audit-level moderate

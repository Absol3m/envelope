# Veille hebdomadaire : un avis de sécurité publié après la dernière fusion apparaît ici (échec visible, courriel
# GitHub) sans attendre la prochaine PR, et sans bloquer une publication (voir ci.yml).
name: Veille des dépendances

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Avis de sécurité
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - run: pnpm audit --prod --audit-level moderate
